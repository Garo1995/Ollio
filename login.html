<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <title>Ollio</title>
</head>
<body>

<section class="entrance-main">
    <div class="container-fluid">
        <div class="row g-0 flex-lg-nowrap justify-content-center entrance-cnt">
            <div class="col-12 col-lg-6 entrance-info d-flex flex-column justify-content-center align-items-center">
                <h1>Добро пожаловать</h1>
                <div class="entrance-form d-flex flex-column">
                    <div class="editing-groups-inp flex-column">
                        <label for="name-url" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="name-url" aria-describedby="login" placeholder="Введите ваш логин">
                    </div>
                    <div class="editing-groups-inp flex-column align-items-start">
                        <label for="password-url" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password-url" aria-describedby="password" placeholder="Введите ваш пароль">
                        <a href="#" class="forget-password">Забыли пароль?</a>
                    </div>
                </div>
                <div class="entrance-btn d-flex align-items-center justify-content-center">
                    <button type="button" class="btn btn-blue">Войти</button>
                </div>
            </div>
            <div class="col-12 col-lg-6 entrance-graphics">
                <h1>Здесь какая-то графика и описание</h1>
            </div>
        </div>
    </div>
</section>


<script src="assets/js/swiper-bundle.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>


</body>
</html>
